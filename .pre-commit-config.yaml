repos:
-   repo: local
    hooks:
      - id: format
        name: format
        entry: bash -c 'cargo fmt'
        language: system
        pass_filenames: false
        stages: [pre-commit]
-   repo: local
    hooks:
      - id: clippy
        name: clippy
        entry: bash -c 'cargo clippy --fix --bin "api-gtw" --allow-dirty'
        language: system
        pass_filenames: false
        stages: [pre-commit]