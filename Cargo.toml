[package]
name = "api-gtw"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4", features = ["openssl"] }
actix-cors = "0.7.0"
openssl = "0.10.68"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_derive = "1.0.217"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
httparse = "1.10"
log = "0.4"
futures = "0.3"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["stream"] }
serde_json = "1.0"
regex = "1.12"
uuid = { version = "1", features = ["v4"]}
inotify = "0.11.0"
futures-util = "0.3.31"
matchit = "0.9.0"
arc-swap = "1.7.1"
